plugins {
    id 'java'
}

version = "1.0.0"
group = "com.swill.hitbox"

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.15.11"
    compileOnly "net.fabricmc.fabric-api:fabric-api:0.91.1+1.20.4"
    compileOnly "com.mojang:minecraft:1.20.4"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from sourceSets.main.output
}
